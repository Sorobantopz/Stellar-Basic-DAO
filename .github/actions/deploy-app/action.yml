name: Deploy Backend App
description: Triggers a deployment via the platform's deploy hook (Render) and verifies health.

inputs:
  image_tag:
    description: Full Docker image tag to deploy
    required: true
  environment:
    description: Target environment (staging | production)
    required: true
  git_sha:
    description: Git SHA being deployed
    required: true
  deploy_hook:
    description: Render deploy hook URL (https://api.render.com/deploy/srv-<id>?key=<key>)
    required: true
  app_url:
    description: Base URL of the deployed app (for health check)
    required: true

runs:
  using: composite
  steps:
    - name: Trigger deployment
      shell: bash
      env:
        DEPLOY_HOOK: ${{ inputs.deploy_hook }}
      run: |
        # Render deploy hooks redeploy the service from its linked repo/image.
        # The hook URL carries its own auth key, so a plain POST suffices.
        echo "Triggering ${{ inputs.environment }} deploy for ${{ inputs.git_sha }}..."
        curl -fsSL -X POST "$DEPLOY_HOOK" \
          -H "Content-Type: application/json" \
          -d '{"clearCache": false}'

    - name: Wait for health check
      shell: bash
      run: |
        echo "Waiting for ${{ inputs.app_url }}/health ..."
        for i in $(seq 1 24); do
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" "${{ inputs.app_url }}/health" || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "Health check passed (attempt ${i})"
            exit 0
          fi
          echo "Attempt ${i}/24 — status ${STATUS}, retrying in 10s..."
          sleep 10
        done
        echo "::error::Health check failed after 4 minutes"
        exit 1

    - name: Log release metadata
      shell: bash
      run: |
        echo "::notice title=Release [${{ inputs.environment }}]::image=${{ inputs.image_tag }} | sha=${{ inputs.git_sha }} | env=${{ inputs.environment }} | ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)"