name: Run Supabase Migrations
description: Applies pending Supabase migrations exactly once and logs the result.

inputs:
  supabase_url:
    description: Supabase project URL
    required: true
  supabase_service_key:
    description: Supabase service-role key
    required: true
  environment:
    description: Target environment (staging | production)
    required: true
  git_sha:
    description: Git SHA being deployed
    required: true

runs:
  using: composite
  steps:
    - name: Run migration script
      id: migrate
      shell: bash
      working-directory: app/backend
      env:
        SUPABASE_URL: ${{ inputs.supabase_url }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ inputs.supabase_service_key }}
      run: |
        # The repo applies migrations with its Node/Supabase client script
        # (pnpm run db:migrate). Capture output so the log is always visible,
        # then exit with the script's real status (PIPESTATUS), not tee's.
        pnpm run db:migrate 2>&1 | tee /tmp/migration.log || true
        STATUS="${PIPESTATUS[0]}"
        APPLIED=$(grep -c 'Executing' /tmp/migration.log || true)
        echo "migrations_applied=${APPLIED}" >> "$GITHUB_OUTPUT"
        exit "$STATUS"

    - name: Log migration metadata
      shell: bash
      run: |
        echo "::notice title=Migration [${{ inputs.environment }}]::Applied ${{ steps.migrate.outputs.migrations_applied }} migration(s) | sha=${{ inputs.git_sha }} | env=${{ inputs.environment }} | ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)"