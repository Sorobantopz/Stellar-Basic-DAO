name: BackendAcademy CI

on:
  pull_request:
    branches: [main]
    paths:
      - "BackendAcademy/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/academy-ci.yml"
  push:
    branches: [main]
    paths:
      - "BackendAcademy/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/academy-ci.yml"

permissions:
  contents: read

concurrency:
  group: academy-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        working-directory: BackendAcademy
        run: pnpm exec eslint "{src,test}/**/*.ts"

      - name: Run jest suite
        working-directory: BackendAcademy
        run: pnpm test -- --ci
