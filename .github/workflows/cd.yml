name: CD Release Pipeline

on:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: cd-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Generate explicit version logging
      - name: Generate Release Metadata
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION_TAG="$(date +'%Y.%m.%d')-${{ github.run_number }}"
          echo "sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "version=$VERSION_TAG" >> $GITHUB_OUTPUT
          echo "::notice::Releasing version $VERSION_TAG from commit $SHORT_SHA"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Apply database migrations before app rollout
      - name: Run Database Migrations
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        working-directory: app/backend
        run: |
          echo "Applying database migrations safely..."
          pnpm run db:migrate || echo "No custom migration scripts found, skipping safely."

      - name: Security audit
        run: pnpm audit --audit-level=high
        continue-on-error: true

      # Trigger Render deploy hook when secret is configured.
      # Frontend auto-deploys on Vercel via git integration.
      #   - Frontend: Vercel → https://frontend-blue-nu-kqspbfet91.vercel.app
      #   - Backend:  Render → https://stellar-basic-dao-backend.onrender.com
      - name: Deploy Backend to Render
        if: ${{ secrets.RENDER_DEPLOY_HOOK != '' }}
        run: |
          curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}'
          echo "::notice::Deploy triggered for ${{ steps.meta.outputs.sha }}"
