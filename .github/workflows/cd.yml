name: CD Release Pipeline

on:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: cd-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Generate explicit version logging
      - name: Generate Release Metadata
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION_TAG="$(date +'%Y.%m.%d')-${{ github.run_number }}"
          echo "sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "version=$VERSION_TAG" >> $GITHUB_OUTPUT
          echo "::notice::Releasing version $VERSION_TAG from commit $SHORT_SHA"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Apply database migrations before rollout. Runs the repo's Supabase
      # migration script via the composite action; skipped when the Supabase
      # secrets aren't configured so CI stays green on forks/preview.
      - name: Run Database Migrations
        if: ${{ secrets.SUPABASE_URL != '' && secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
        uses: ./.github/actions/run-migrations
        with:
          supabase_url: ${{ secrets.SUPABASE_URL }}
          supabase_service_key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          environment: production
          git_sha: ${{ steps.meta.outputs.sha }}

      - name: Security audit
        run: pnpm audit --audit-level=high
        continue-on-error: true

      # Explicit backend deploy via the Render deploy hook (git integration
      # remains the primary auto-deploy path; this step gives CD an explicit
      # trigger + health check when the hook secret is configured). The
      # frontend auto-deploys on Vercel via its git integration.
      #   - Frontend: Vercel  → https://stellar-basic-dao-frontend.vercel.app
      #   - Backend:  Render  → https://stellar-basic-dao-backend.onrender.com
      - name: Deploy Backend to Render
        if: ${{ secrets.RENDER_DEPLOY_HOOK != '' }}
        uses: ./.github/actions/deploy-app
        with:
          image_tag: ${{ steps.meta.outputs.version }}
          environment: production
          git_sha: ${{ steps.meta.outputs.sha }}
          deploy_hook: ${{ secrets.RENDER_DEPLOY_HOOK }}
          app_url: https://stellar-basic-dao-backend.onrender.com
