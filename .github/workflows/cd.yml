name: CD Release Pipeline

on:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: cd-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Generate explicit version logging
      - name: Generate Release Metadata
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION_TAG="$(date +'%Y.%m.%d')-${{ github.run_number }}"
          echo "sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "version=$VERSION_TAG" >> $GITHUB_OUTPUT
          echo "::notice::Releasing version $VERSION_TAG from commit $SHORT_SHA"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Apply database migrations before rollout. Skipped when Supabase
      # secrets aren't configured so CI stays green on forks/preview.
      - name: Run Database Migrations
        if: ${{ secrets.SUPABASE_URL != '' && secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
        working-directory: app/backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          pnpm run db:migrate 2>&1 | tee /tmp/migration.log || true
          STATUS="${PIPESTATUS[0]}"
          APPLIED=$(grep -c 'Executing' /tmp/migration.log || true)
          echo "::notice title=Migration [production]::Applied ${APPLIED} migration(s) | sha=${{ steps.meta.outputs.sha }}"
          exit "$STATUS"

      - name: Security audit
        run: pnpm audit --audit-level=high
        continue-on-error: true

      # Trigger a Render deploy via the deploy hook, then wait for /health.
      # Skipped when RENDER_DEPLOY_HOOK secret is not configured.
      #   - Frontend: Vercel → https://frontend-blue-nu-kqspbfet91.vercel.app
      #   - Backend:  Render → https://stellar-basic-dao-backend.onrender.com
      - name: Deploy Backend to Render
        if: ${{ secrets.RENDER_DEPLOY_HOOK != '' }}
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          echo "Triggering production deploy for ${{ steps.meta.outputs.sha }}..."
          curl -fsSL -X POST "$DEPLOY_HOOK" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}'

          echo "Waiting for https://stellar-basic-dao-backend.onrender.com/health ..."
          for i in $(seq 1 24); do
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" \
              "https://stellar-basic-dao-backend.onrender.com/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (attempt ${i})"
              echo "::notice title=Release [production]::version=${{ steps.meta.outputs.version }} | sha=${{ steps.meta.outputs.sha }} | ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              exit 0
            fi
            echo "Attempt ${i}/24 — status ${STATUS}, retrying in 10s..."
            sleep 10
          done
          echo "::error::Health check failed after 4 minutes"
          exit 1
