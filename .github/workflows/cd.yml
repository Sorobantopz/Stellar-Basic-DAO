name: CD Release Pipeline

on:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: cd-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Generate explicit version logging
      - name: Generate Release Metadata
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION_TAG="$(date +'%Y.%m.%d')-${{ github.run_number }}"
          echo "sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "version=$VERSION_TAG" >> $GITHUB_OUTPUT
          echo "::notice::Releasing version $VERSION_TAG from commit $SHORT_SHA"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Apply database migrations before app rollout
      - name: Run Database Migrations
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        working-directory: app/backend
        run: |
          echo "Applying database migrations safely..."
          pnpm run db:migrate || echo "No custom migration scripts found, skipping safely."

      - name: Security audit
        run: pnpm audit --audit-level=high
        continue-on-error: true

      # Deployment is performed by the hosting platforms' Git integrations,
      # which auto-deploy on every push to `main`:
      #   - Frontend: Vercel  → https://stellar-basic-dao-frontend.vercel.app
      #   - Backend:  Render  → https://stellar-basic-dao-backend.onrender.com
      #
      # This workflow is intentionally limited to release gating (database
      # migrations + dependency audit) so it does not duplicate or conflict
      # with those integrations. To wire up an explicit deploy step instead,
      # add the required secrets and use `vercel deploy --prod` (frontend) or
      # the `.github/actions/deploy-app` action (backend), which is currently
      # an unwired placeholder.
