name: Contract Deploy

on:
  workflow_dispatch:
    inputs:
      network:
        description: 'Target network'
        required: true
        default: 'testnet'
        type: choice
        options:
          - testnet
          - mainnet
      contracts:
        description: 'Sub-contracts to deploy (comma-separated, or "all")'
        required: false
        default: 'all'
        type: string
      dry_run:
        description: 'Dry run (simulate without deploying)'
        required: false
        default: false
        type: boolean
      force_deploy:
        description: 'Force deploy even if contract exists'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: contract-deploy-${{ github.event.inputs.network }}
  cancel-in-progress: false

env:
  CONTRACT_DIR: app/contract

jobs:
  # ── Build all sub-contract WASM artifacts ──────────────────────────
  build:
    name: Build WASM Artifacts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.CONTRACT_DIR }}
    outputs:
      wasm_hashes: ${{ steps.hash.outputs.hashes }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        # Match the toolchain pinned in app/contract/rust-toolchain.toml
        uses: dtolnay/rust-toolchain@1.120.0
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "${{ env.CONTRACT_DIR }}"

      - name: Install wasm-opt (binaryen)
        run: |
          curl -sL https://github.com/WebAssembly/binaryen/releases/download/version_120/binaryen-version_120-x86_64-linux.tar.gz -o /tmp/binaryen.tar.gz
          tar xzf /tmp/binaryen.tar.gz -C /tmp
          sudo cp /tmp/binaryen-version_120/bin/wasm-opt /usr/local/bin/
          wasm-opt --version

      - name: Install Stellar CLI
        run: cargo install stellar-cli --locked 2>/dev/null || echo "Stellar CLI already installed"

      - name: Build all sub-contracts
        run: |
          echo "Building all sub-contracts for wasm32-unknown-unknown..."
          for crate in stellar-dao-escrow stellar-dao-governance stellar-dao-fee stellar-dao-stealth; do
            echo "  → Building $crate..."
            cargo build --target wasm32-unknown-unknown --release -p "$crate"
          done
          echo "✅ All builds complete"

      - name: Optimize WASM with wasm-opt
        run: |
          RELEASE_DIR="target/wasm32-unknown-unknown/release"
          for crate in stellar_dao_escrow stellar_dao_governance stellar_dao_fee stellar_dao_stealth; do
            WASM="$RELEASE_DIR/${crate}.wasm"
            if [ -f "$WASM" ]; then
              ORIG_SIZE=$(stat -c%s "$WASM" 2>/dev/null || stat -f%z "$WASM")
              wasm-opt --disable-reference-types --disable-exception-handling \
                --disable-simd --disable-multivalue --disable-bulk-memory \
                -Oz "$WASM" -o "${WASM%.wasm}.optimized.wasm"
              OPT_SIZE=$(stat -c%s "${WASM%.wasm}.optimized.wasm" 2>/dev/null || stat -f%z "${WASM%.wasm}.optimized.wasm")
              echo "  $crate: $ORIG_SIZE → $OPT_SIZE bytes"
            fi
          done

      - name: Verify WASM sizes
        id: hash
        run: |
          RELEASE_DIR="target/wasm32-unknown-unknown/release"
          echo '{"hashes":{' > /tmp/wasm_hashes.json
          first=true
          for crate in stellar_dao_escrow stellar_dao_governance stellar_dao_fee stellar_dao_stealth; do
            WASM="$RELEASE_DIR/${crate}.optimized.wasm"
            if [ -f "$WASM" ]; then
              SIZE=$(stat -c%s "$WASM" 2>/dev/null || stat -f%z "$WASM")
              HASH=$(sha256sum "$WASM" | awk '{print $1}')
              echo "  $crate: ${SIZE} bytes, sha256=$HASH"
              # Warn if over 64KB
              if [ "$SIZE" -gt 65536 ]; then
                echo "  ⚠️  $crate is ${SIZE} bytes (>64KB Soroban limit)"
              fi
              [ "$first" = "true" ] || echo -n ',' >> /tmp/wasm_hashes.json
              echo -n "\"$crate\":\"$HASH\"" >> /tmp/wasm_hashes.json
              first=false
            fi
          done
          echo '}}' >> /tmp/wasm_hashes.json
          echo "hashes=$(cat /tmp/wasm_hashes.json)" >> $GITHUB_OUTPUT

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: contract-wasms-${{ github.run_id }}
          path: ${{ env.CONTRACT_DIR }}/target/wasm32-unknown-unknown/release/*.optimized.wasm
          retention-days: 7

  # ── Deploy each sub-contract (matrix) ─────────────────────────────
  deploy:
    name: Deploy ${{ matrix.contract }}
    needs: build
    # Honor the workflow's `contracts` input: 'all' (default) deploys every
    # sub-contract, otherwise only the comma-separated ones listed.
    if: ${{ github.event.inputs.contracts == 'all' || contains(github.event.inputs.contracts, matrix.contract) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.CONTRACT_DIR }}
    strategy:
      fail-fast: false
      matrix:
        contract:
          - stellar-dao-escrow
          - stellar-dao-governance
          - stellar-dao-fee
          - stellar-dao-stealth

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Stellar CLI
        run: cargo install stellar-cli --locked 2>/dev/null || echo "Stellar CLI already installed"

      - name: Download WASM artifacts
        uses: actions/download-artifact@v8
        with:
          name: contract-wasms-${{ github.run_id }}
          # Place artifacts in the working directory used by the steps below
          path: ${{ env.CONTRACT_DIR }}

      - name: Resolve secrets for network
        id: secrets
        env:
          NETWORK: ${{ github.event.inputs.network }}
        run: |
          NETWORK_UPPER=$(echo "$NETWORK" | tr '[:lower:]' '[:upper:]')
          echo "network=$NETWORK" >> $GITHUB_OUTPUT
          # Secrets are resolved via env: in subsequent steps

      - name: Configure Stellar CLI network
        env:
          NETWORK: ${{ github.event.inputs.network }}
        run: |
          if [ "$NETWORK" = "testnet" ]; then
            stellar network add testnet \
              --rpc-url "https://soroban-testnet.stellar.org" \
              --network-passphrase "Test SDF Network ; September 2015" \
              2>/dev/null || echo "Network testnet already configured"
          elif [ "$NETWORK" = "mainnet" ]; then
            stellar network add mainnet \
              --rpc-url "https://mainnet.stellar.org" \
              --network-passphrase "Public Global Stellar Network ; September 2015" \
              2>/dev/null || echo "Network mainnet already configured"
          fi

      - name: Deploy ${{ matrix.contract }}
        if: ${{ github.event.inputs.dry_run == 'false' }}
        id: deploy
        env:
          NETWORK: ${{ github.event.inputs.network }}
          # Secrets — GitHub redacts these in logs automatically
          TESTNET_DEPLOY_KEY: ${{ secrets.TESTNET_DEPLOY_KEY }}
          MAINNET_DEPLOY_KEY: ${{ secrets.MAINNET_DEPLOY_KEY }}
        run: |
          # Cargo emits wasm artifacts with underscores (stellar_dao_escrow.wasm)
          # while the matrix uses the crate name with hyphens (stellar-dao-escrow).
          WASM_BASENAME=$(echo "${{ matrix.contract }}" | tr '-' '_')
          WASM_FILE="${WASM_BASENAME}.optimized.wasm"
          WASM_NAME="${{ matrix.contract }}"

          if [ ! -f "$WASM_FILE" ]; then
            echo "❌ WASM not found: $WASM_FILE"
            ls -la *.wasm 2>/dev/null || echo "  (no .optimized.wasm files)"
            exit 1
          fi

          # Select deploy key per network
          NETWORK_UPPER=$(echo "$NETWORK" | tr '[:lower:]' '[:upper:]')
          DEPLOY_KEY_VAR="${NETWORK_UPPER}_DEPLOY_KEY"
          DEPLOY_KEY="${!DEPLOY_KEY_VAR}"

          if [ -z "$DEPLOY_KEY" ]; then
            echo "❌ No deploy key configured for $NETWORK. Set ${NETWORK_UPPER}_DEPLOY_KEY secret."
            exit 1
          fi

          echo "🚀 Deploying $WASM_NAME to $NETWORK..."
          CONTRACT_ID=$(stellar contract deploy \
            --wasm "$WASM_FILE" \
            --source "$DEPLOY_KEY" \
            --network "$NETWORK")

          echo "contract_id=$CONTRACT_ID" >> $GITHUB_OUTPUT
          echo "✅ $WASM_NAME deployed: $CONTRACT_ID"

      - name: Initialize governance contract
        if: ${{ matrix.contract == 'stellar-dao-governance' && github.event.inputs.dry_run == 'false' }}
        env:
          NETWORK: ${{ github.event.inputs.network }}
          TESTNET_DEPLOY_KEY: ${{ secrets.TESTNET_DEPLOY_KEY }}
          TESTNET_ADMIN_KEY: ${{ secrets.TESTNET_ADMIN_KEY }}
          MAINNET_DEPLOY_KEY: ${{ secrets.MAINNET_DEPLOY_KEY }}
          MAINNET_ADMIN_KEY: ${{ secrets.MAINNET_ADMIN_KEY }}
          CONTRACT_ID: ${{ steps.deploy.outputs.contract_id }}
        run: |
          NETWORK_UPPER=$(echo "$NETWORK" | tr '[:lower:]' '[:upper:]')
          DEPLOY_KEY_VAR="${NETWORK_UPPER}_DEPLOY_KEY"
          ADMIN_KEY_VAR="${NETWORK_UPPER}_ADMIN_KEY"
          ADMIN_KEY="${!ADMIN_KEY_VAR}"

          if [ -z "$ADMIN_KEY" ]; then
            echo "ℹ️  No admin key configured. Skipping governance initialization."
            exit 0
          fi

          echo "🔧 Initializing governance contract with admin $ADMIN_KEY..."
          stellar contract invoke \
            --id "$CONTRACT_ID" \
            --source "${!DEPLOY_KEY_VAR}" \
            --network "$NETWORK" \
            -- \
            initialize \
            --admin "$ADMIN_KEY"
          echo "✅ Governance contract initialized"

      - name: Health check
        if: ${{ github.event.inputs.dry_run == 'false' }}
        continue-on-error: true
        env:
          NETWORK: ${{ github.event.inputs.network }}
          CONTRACT_ID: ${{ steps.deploy.outputs.contract_id }}
        run: |
          if [ -z "$CONTRACT_ID" ]; then
            echo "❌ No contract ID for health check"
            exit 0
          fi
          echo "🏥 Running health_check on $CONTRACT_ID..."
          stellar contract invoke \
            --id "$CONTRACT_ID" \
            --network "$NETWORK" \
            -- \
            health_check 2>&1 || echo "⚠️  Health check inconclusive"

      - name: Deployment summary
        if: ${{ github.event.inputs.dry_run == 'false' }}
        env:
          CONTRACT_NAME: ${{ matrix.contract }}
          CONTRACT_ID: ${{ steps.deploy.outputs.contract_id }}
          NETWORK: ${{ github.event.inputs.network }}
        run: |
          echo "## $CONTRACT_NAME deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Network | $NETWORK |" >> $GITHUB_STEP_SUMMARY
          echo "| Contract | $CONTRACT_NAME |" >> $GITHUB_STEP_SUMMARY
          echo "| Contract ID | \`$CONTRACT_ID\` |" >> $GITHUB_STEP_SUMMARY

  # ── Aggregate summary ─────────────────────────────────────────────
  summary:
    name: Deployment Summary
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Generate summary
        env:
          NETWORK: ${{ github.event.inputs.network }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "## 🧪 Dry Run Complete" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All sub-contracts built and verified. No contracts were deployed." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Built sub-contracts:" >> $GITHUB_STEP_SUMMARY
            echo "- stellar-dao-escrow (core deposit/withdraw/refund)" >> $GITHUB_STEP_SUMMARY
            echo "- stellar-dao-governance (multisig proposals/admin)" >> $GITHUB_STEP_SUMMARY
            echo "- stellar-dao-fee (fee configuration/routing)" >> $GITHUB_STEP_SUMMARY
            echo "- stellar-dao-stealth (stealth addresses)" >> $GITHUB_STEP_SUMMARY
          else
            echo "## 🚀 Deployment Complete ($NETWORK)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All sub-contracts deployed to **$NETWORK**." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📝 Update [environment-registry.toml](app/contract/documentation/environment-registry.toml)" >> $GITHUB_STEP_SUMMARY
            echo "with the contract IDs from each sub-contract deployment summary above." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Sub-contract | Status |" >> $GITHUB_STEP_SUMMARY
            echo "|-------------|--------|" >> $GITHUB_STEP_SUMMARY
            echo "| stellar-dao-escrow | ${{ needs.deploy.result }} |" >> $GITHUB_STEP_SUMMARY
            echo "| stellar-dao-governance | ${{ needs.deploy.result }} |" >> $GITHUB_STEP_SUMMARY
            echo "| stellar-dao-fee | ${{ needs.deploy.result }} |" >> $GITHUB_STEP_SUMMARY
            echo "| stellar-dao-stealth | ${{ needs.deploy.result }} |" >> $GITHUB_STEP_SUMMARY
          fi
