name: Contract CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'app/contract/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'app/contract/**'

permissions:
  contents: read

concurrency:
  group: contract-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/contract

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        # Match the toolchain pinned in app/contract/rust-toolchain.toml
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "app/contract"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --target wasm32-unknown-unknown --release

      # Report WASM artifact sizes. This is informational (non-blocking): the
      # unoptimized CI build is larger than the wasm-opt -Oz artifacts that
      # contract-deploy.yml checks against the ~64KB Soroban deploy limit.
      - name: Report WASM sizes
        run: |
          RELEASE_DIR="target/wasm32-unknown-unknown/release"
          echo "### WASM artifact sizes (unoptimized release build)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Crate | Size (bytes) |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          for crate in stellar_dao_escrow stellar_dao_governance stellar_dao_fee stellar_dao_stealth; do
            WASM="$RELEASE_DIR/${crate}.wasm"
            if [ -f "$WASM" ]; then
              SIZE=$(stat -c%s "$WASM" 2>/dev/null || stat -f%z "$WASM")
              echo "  $crate: ${SIZE} bytes"
              echo "| \`$crate\` | ${SIZE} |" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Run tests
        run: cargo test

      - name: Run tests with coverage
        run: |
          cargo install cargo-llvm-cov --locked 2>/dev/null || true
          cargo llvm-cov --workspace --lcov --output-path lcov.info 2>/dev/null || echo "Coverage report skipped (cargo-llvm-cov not available)"

      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          flags: contract
          fail_ci_if_error: false
        continue-on-error: true