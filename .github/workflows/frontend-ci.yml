name: Frontend CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/frontend/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "app/frontend/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-type-check:
    name: Lint and Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        working-directory: ./app/frontend
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        working-directory: ./app/frontend
        run: pnpm exec eslint . --max-warnings 0

      - name: Run TypeScript type check
        working-directory: ./app/frontend
        run: pnpm exec tsc --noEmit

  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: lint-and-type-check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        working-directory: ./app/frontend
        run: pnpm install --frozen-lockfile

      - name: Build Next.js
        working-directory: ./app/frontend
        run: pnpm run build
        env:
          NEXT_PUBLIC_STELLAR_BASIC_DAO_API_URL: ${{ secrets.NEXT_PUBLIC_STELLAR_BASIC_DAO_API_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_STELLAR_NETWORK: ${{ secrets.NEXT_PUBLIC_STELLAR_NETWORK }}
          NEXT_PUBLIC_ERROR_REPORTING_ENABLED: ${{ secrets.NEXT_PUBLIC_ERROR_REPORTING_ENABLED }}
          NEXT_PUBLIC_APP_VERSION: ${{ secrets.NEXT_PUBLIC_APP_VERSION }}

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        working-directory: ./app/frontend
        run: pnpm install --frozen-lockfile

      # pnpm audits the whole workspace lockfile (mobile/expo and
      # BackendAcademy toolchains included). The remaining advisories are
      # transitive dev/build-time deps with no safe in-range fix; the
      # production-critical issues (Next.js) are handled by staying on a
      # patched release. Keep the report visible but non-blocking, matching
      # the backend CI audit step.
      - name: Run pnpm audit
        working-directory: ./app/frontend
        run: pnpm audit --audit-level=moderate
        continue-on-error: true

      - name: Check for mixed content
        run: |
          echo "Checking for hardcoded HTTP URLs in frontend code..."
          # Search for HTTP URLs, filter out localhost, and check if any remain
          if grep -r "http://" app/frontend/src --include="*.ts" --include="*.tsx" --exclude-dir=node_modules 2>/dev/null | grep -v "http://localhost" > /dev/null 2>&1; then
            echo "❌ Found hardcoded HTTP URLs (non-localhost). This may cause mixed-content issues in production."
            grep -r "http://" app/frontend/src --include="*.ts" --include="*.tsx" --exclude-dir=node_modules | grep -v "http://localhost"
            exit 1
          else
            echo "✅ No problematic HTTP URLs found"
          fi
